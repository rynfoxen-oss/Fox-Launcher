name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish launcher + installer
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxlauncher-win-x64
          path: |
            artifacts/publish/FoxLauncher.exe
            artifacts/installer/Launcher.Installer.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            artifacts/publish/FoxLauncher.exe `
            artifacts/installer/Launcher.Installer.exe `
            --generate-notes
