name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 1. Publish the launcher.
      - name: Publish launcher
        shell: pwsh
        run: ./build.ps1 -LauncherOnly

      # 2. Sign the launcher via SignPath.io before the installer embeds it
      #    (skipped until SIGNPATH_API_TOKEN and the other secrets are set).
      - name: Upload unsigned launcher
        if: env.HAS_SIGNPATH == 'true'
        id: upload-launcher
        uses: actions/upload-artifact@v4
        with:
          name: foxlauncher-unsigned
          path: artifacts/publish/FoxLauncher.exe
          if-no-files-found: error

      - name: Sign launcher (SignPath)
        if: env.HAS_SIGNPATH == 'true'
        id: sign-launcher
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-launcher.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed-launcher

      - name: Replace launcher with signed copy
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          Move-Item artifacts/signed-launcher/FoxLauncher.exe artifacts/publish/FoxLauncher.exe -Force

      # 3. Publish the installer, which embeds the (signed) launcher.
      - name: Publish installer
        shell: pwsh
        run: ./build.ps1 -InstallerOnly

      # 4. Sign the installer via SignPath.io.
      - name: Upload unsigned installer
        if: env.HAS_SIGNPATH == 'true'
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: foxlauncher-installer-unsigned
          path: artifacts/installer/Launcher.Installer.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: env.HAS_SIGNPATH == 'true'
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed-installer

      - name: Replace installer with signed copy
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          Move-Item artifacts/signed-installer/Launcher.Installer.exe artifacts/installer/Launcher.Installer.exe -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxlauncher-win-x64
          path: |
            artifacts/publish/FoxLauncher.exe
            artifacts/installer/Launcher.Installer.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            artifacts/publish/FoxLauncher.exe `
            artifacts/installer/Launcher.Installer.exe `
            --generate-notes
